name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request makes its older run pointless, so those are cancelled. A run on `main` is never
# cancelled: each has its own group (the commit), so every commit that lands gets its full result. With one group per
# ref, a second run on `main` cancelled the run in progress for the commit before it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node-version:
          - 20
          - 22
          - 24
        # The Node versions are covered on Ubuntu, the cheapest runner. macOS and Windows exist to catch what depends
        # on the operating system (paths, shims, process spawning), so they run the range's two ends or, for
        # Windows, the newest line only.
        exclude:
          - os: macos-latest
            node-version: 22
          - os: windows-latest
            node-version: 20
          - os: windows-latest
            node-version: 22

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Syntax check
        run: npm run check

      # Documentation links, anchors, orphan pages and docs-vs-code drift are OS-independent, so one cell is enough.
      - name: Docs check
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node-version == 22 }}
        run: npm run check:docs

      # Lint and format are OS-independent, so one cell is enough.
      - name: Lint and format check
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node-version == 22 }}
        run: npm run lint

      # Separate steps so one failing suite does not hide failures in the others.
      - name: Unit tests
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.node-version == 22) }}
        run: npm run test:unit

      - name: Integration tests
        if: ${{ always() && !(matrix.os == 'ubuntu-latest' && matrix.node-version == 22) }}
        run: npm run test:integration

      - name: End-to-end tests
        if: ${{ always() && !(matrix.os == 'ubuntu-latest' && matrix.node-version == 22) }}
        run: npm run test:e2e

      # One cell also enforces the coverage floor (see test:coverage in package.json).
      - name: Test with coverage
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node-version == 22 }}
        run: npm run test:coverage

  # Runs the same suites against the real OpenSpec CLI, because the fake CLIs used by the other jobs are only as
  # faithful as we make them. Not a required check: a registry hiccup or a new OpenSpec release should not block merges.
  openspec-contract:
    name: Contract / real OpenSpec
    runs-on: ubuntu-latest
    env:
      TRUSS_REQUIRE_REAL_OPENSPEC: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install OpenSpec 1.x
        run: npm install --global @fission-ai/openspec@1

      - name: OpenSpec version
        run: openspec --version

      - name: Contract test
        run: node scripts/run-tests.mjs e2e
