name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node-version:
          - 20
          - 22
          - 24

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Syntax check
        run: npm run check

      # Lint and format are OS-independent, so one cell is enough.
      - name: Lint and format check
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node-version == 22 }}
        run: npm run lint

      # Separate steps so one failing suite does not hide failures in the others.
      - name: Unit tests
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.node-version == 22) }}
        run: npm run test:unit

      - name: Integration tests
        if: ${{ always() && !(matrix.os == 'ubuntu-latest' && matrix.node-version == 22) }}
        run: npm run test:integration

      - name: End-to-end tests
        if: ${{ always() && !(matrix.os == 'ubuntu-latest' && matrix.node-version == 22) }}
        run: npm run test:e2e

      # One cell also enforces the coverage floor (see test:coverage in package.json).
      - name: Test with coverage
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node-version == 22 }}
        run: npm run test:coverage
